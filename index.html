<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Booth</title>
<style>
  :root { --bg:#f8f9fb; --ink:#17181c; --pink:#ee82a3; --blue:#6f9cf0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; align-items:center; padding:24px 16px; min-height:100vh; }
  h1 { margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:#666; }
  .card { background:#fff; border:2px solid #e4e5ea; border-radius:20px; padding:20px; width:100%; max-width:420px; }
  button { font:inherit; font-weight:600; border:0; border-radius:14px; padding:12px 18px; cursor:pointer;
           background:var(--ink); color:#fff; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.alt { background:#fff; color:var(--ink); border:2px solid #e4e5ea; }
  #joinCode { font:inherit; padding:12px; border-radius:14px; border:2px solid #e4e5ea; width:100%;
          text-transform:uppercase; letter-spacing:4px; text-align:center; }
  .row { display:flex; gap:10px; margin-top:12px; }
  .row > * { flex:1; }
  #call { display:none; width:100%; max-width:900px; }
  .stage { position:relative; }
  .videos { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  video { width:100%; background:#000; border-radius:16px; aspect-ratio:4/3; object-fit:cover; }
  #localVideo { transform: scaleX(-1); }
  .label { font-size:13px; color:#666; margin:6px 0 0 4px; }
  #status { margin-top:14px; font-size:14px; color:#666; text-align:center; }
  .code { font-size:32px; letter-spacing:8px; font-weight:800; text-align:center; margin:8px 0; }
  #count { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
           font-size:120px; font-weight:800; color:#fff; text-shadow:0 4px 24px rgba(0,0,0,.5); pointer-events:none; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s; border-radius:16px; }
  #flash.on { opacity:.9; transition:none; }
  #info { text-align:center; font-size:14px; color:#666; margin-top:10px; min-height:20px; }
  #results { display:none; margin-top:24px; }
  #strip { width:100%; max-width:320px; display:block; margin:0 auto; border-radius:6px;
           box-shadow:0 8px 30px rgba(0,0,0,.15); }
  .opts { text-align:center; margin-top:14px; font-size:14px; color:#666; }
  .sect { text-align:center; font-size:13px; font-weight:600; color:#888; margin-top:18px; }

  .chips { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:520px; margin:8px auto 0; }
  .chip { background:#fff; border:2px solid #e4e5ea; border-radius:14px; padding:6px; cursor:pointer;
          text-align:center; font-size:12px; font-weight:600; color:var(--ink); user-select:none; }
  .chip canvas { width:56px; height:84px; display:block; border-radius:8px; margin-bottom:4px; }
  .chips.lay .chip canvas { height:56px; margin:0 auto 4px; background:#f1f2f5; }
  .chip.active { border-color:var(--pink); }
  .chips.locked { opacity:.45; pointer-events:none; }

  @media (max-width:600px){ .videos { grid-template-columns:1fr; } #count{font-size:90px;} }
</style>
</head>
<body>
  <h1>Booth</h1>
  <p class="sub">A photobooth for two.</p>

  <div class="card" id="lobby">
    <button id="createBtn" style="width:100%">Start a room</button>
    <div class="row">
      <input id="joinCode" maxlength="5" placeholder="CODE" />
      <button class="alt" id="joinBtn">Join</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="call">
    <div class="code" id="roomCode"></div>
    <div class="stage">
      <div class="videos">
        <div><video id="localVideo" autoplay muted playsinline></video><div class="label">You</div></div>
        <div><video id="remoteVideo" autoplay playsinline></video><div class="label" id="remoteLabel">Waiting...</div></div>
      </div>
      <div id="flash"></div>
      <div id="count"></div>
    </div>
    <div id="info"></div>

    <div class="sect">Layout</div>
    <div class="chips lay" id="layouts"></div>

    <div class="row" style="max-width:520px;margin:16px auto 0">
      <button id="shootBtn" disabled>Take photos</button>
      <button class="alt" id="muteBtn">Mute</button>
      <button class="alt" id="camBtn">Camera off</button>
      <button class="alt" id="leaveBtn">Leave</button>
    </div>

    <div id="results">
      <canvas id="strip"></canvas>
      <div class="sect">Frame</div>
      <div class="chips" id="chips"></div>
      <div class="opts"><label><input type="checkbox" id="mirror" checked /> Mirror photos</label></div>
      <div class="row" style="max-width:420px;margin:12px auto 0">
        <button id="downloadBtn">Download</button>
        <button class="alt" id="retakeBtn">Retake</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const PREFIX = "booth-pick-something-unique-"; // keep the same one you used before
    const $ = (id) => document.getElementById(id);
    let peer, localStream, currentCall, conn;
    let running = false;
    let isHost = false;
    let mine = [], theirs = [];
    let styleId = "black";
    let layoutId = "strip";

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    function setStatus(t) { $("status").textContent = t; }

    // ---------- layouts ----------
    // shots: photos needed | cols: grid columns | cell: size of each (two-person) cell
    const LAYOUTS = {
      strip:    { name: "4 cut",    sub: "classic strip", shots: 4, cols: 1, cellW: 720, cellH: 540, pad: 40, gap: 24, footer: 110, font: 34 },
      grid:     { name: "2 × 2",    sub: "four, on a card", shots: 4, cols: 2, cellW: 560, cellH: 420, pad: 40, gap: 24, footer: 110, font: 34 },
      two:      { name: "2 cut",    sub: "two big photos", shots: 2, cols: 1, cellW: 800, cellH: 600, pad: 40, gap: 24, footer: 110, font: 34 },
      polaroid: { name: "Polaroid", sub: "one shot", shots: 1, cols: 1, cellW: 800, cellH: 640, pad: 50, gap: 0,  footer: 220, font: 48 },
    };
    const shots = () => LAYOUTS[layoutId].shots;

    function layoutSize(l) {
      const rows = Math.ceil(l.shots / l.cols);
      return {
        rows,
        W: l.pad * 2 + l.cols * l.cellW + (l.cols - 1) * l.gap,
        H: l.pad + rows * l.cellH + (rows - 1) * l.gap + l.footer,
      };
    }
    function cellXY(l, i) {
      return {
        x: l.pad + (i % l.cols) * (l.cellW + l.gap),
        y: l.pad + Math.floor(i / l.cols) * (l.cellH + l.gap),
      };
    }

    function renderLayoutChips() {
      const box = $("layouts");
      box.innerHTML = "";
      for (const [id, l] of Object.entries(LAYOUTS)) {
        const chip = document.createElement("div");
        chip.className = "chip" + (id === layoutId ? " active" : "");
        chip.dataset.id = id;
        const cv = document.createElement("canvas");
        cv.width = 112; cv.height = 112;
        const cx = cv.getContext("2d");
        const { W, H } = layoutSize(l);
        const s = Math.min(100 / W, 100 / H);
        const ox = (112 - W * s) / 2, oy = (112 - H * s) / 2;
        cx.fillStyle = "#17181c";
        cx.fillRect(ox, oy, W * s, H * s);
        cx.fillStyle = "#ffffff";
        for (let i = 0; i < l.shots; i++) {
          const { x, y } = cellXY(l, i);
          cx.fillRect(ox + x * s, oy + y * s, l.cellW * s, l.cellH * s);
        }
        const label = document.createElement("div");
        label.textContent = l.name;
        chip.append(cv, label);
        chip.onclick = () => setLayout(id, true);
        box.appendChild(chip);
      }
    }

    function setLayout(id, fromMe) {
      if (!LAYOUTS[id] || running) return;
      layoutId = id;
      document.querySelectorAll("#layouts .chip").forEach(c => c.classList.toggle("active", c.dataset.id === id));
      if (fromMe && conn && conn.open) conn.send({ type: "layout", id });
      if ($("results").style.display === "block") {
        const have = Math.min(mine.filter(Boolean).length, theirs.filter(Boolean).length);
        if (have >= shots()) showResults();
        else {
          $("results").style.display = "none";
          $("info").textContent = "New layout needs more photos. Take new ones!";
        }
      }
    }

    // ---------- camera / call ----------
    function makeCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      return Array.from({length:5}, () => chars[Math.floor(Math.random()*chars.length)]).join("");
    }

    async function getCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { width:{ideal:1280}, height:{ideal:960}, facingMode:"user" },
          audio: true
        });
        $("localVideo").srcObject = localStream;
        return true;
      } catch (e) {
        setStatus("Camera/mic blocked. Allow access and try again.");
        return false;
      }
    }

    function showCall(code) {
      $("lobby").style.display = "none";
      $("call").style.display = "block";
      $("roomCode").textContent = code;
    }

    function attachCall(call) {
      currentCall = call;
      call.on("stream", (remote) => {
        $("remoteVideo").srcObject = remote;
        $("remoteLabel").textContent = "Them";
      });
      call.on("close", () => { $("remoteLabel").textContent = "Disconnected"; });
    }

    // ---------- data channel (messages + photos) ----------
    function setupConn(c) {
      conn = c;
      const ready = () => {
        $("shootBtn").disabled = false;
        $("info").textContent = "Connected. Ready when you are.";
        if (isHost) {   // creator's choices become the starting point for both
          conn.send({ type: "layout", id: layoutId });
          conn.send({ type: "style", id: styleId });
        }
      };
      if (c.open) ready(); else c.on("open", ready);
      c.on("data", onData);
      c.on("close", () => { $("shootBtn").disabled = true; $("info").textContent = "Connection lost."; });
    }

    function onData(msg) {
      if (msg.type === "start") {
        if (!running) { if (msg.layout) setLayout(msg.layout, false); runSequence(false); }
      } else if (msg.type === "shot") {
        theirs[msg.index] = URL.createObjectURL(new Blob([msg.data], { type: "image/jpeg" }));
      } else if (msg.type === "style") {
        setStyle(msg.id, false);
      } else if (msg.type === "layout") {
        setLayout(msg.id, false);
      }
    }

    // ---------- capture ----------
    function captureLocal() {
      const v = $("localVideo");
      const scale = Math.min(1, 960 / v.videoWidth);
      const c = document.createElement("canvas");
      c.width = Math.round(v.videoWidth * scale);
      c.height = Math.round(v.videoHeight * scale);
      c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
      return new Promise(res => c.toBlob(res, "image/jpeg", 0.9));
    }

    async function countdown() {
      const el = $("count");
      el.style.display = "flex";
      for (let n = 3; n >= 1; n--) { el.textContent = n; await sleep(1000); }
      el.style.display = "none";
    }

    async function flash() {
      const f = $("flash");
      f.classList.add("on");
      await sleep(60);
      f.classList.remove("on");
    }

    async function waitFor(cond, timeout = 15000) {
      const t0 = Date.now();
      while (!cond() && Date.now() - t0 < timeout) await sleep(100);
      return cond();
    }

    async function runSequence(initiator) {
      if (running) return;
      running = true;
      $("layouts").classList.add("locked");
      mine = []; theirs = [];
      $("results").style.display = "none";
      $("shootBtn").disabled = true;
      if (initiator) conn.send({ type: "start", layout: layoutId });

      const n = shots();
      for (let i = 0; i < n; i++) {
        $("info").textContent = `Photo ${i + 1} of ${n}`;
        await countdown();
        const blob = await captureLocal();
        flash();
        mine[i] = URL.createObjectURL(blob);
        conn.send({ type: "shot", index: i, data: await blob.arrayBuffer() });
        await sleep(600);
      }

      $("info").textContent = "Getting their photos...";
      const ok = await waitFor(() => theirs.filter(Boolean).length >= n);
      $("info").textContent = ok ? "Done!" : "Some of their photos didn't arrive. Try again.";
      await showResults();
      running = false;
      $("layouts").classList.remove("locked");
      $("shootBtn").disabled = false;
    }

    // ---------- frame styles (all drawn in code) ----------
    function heart(ctx, x, y, s, color) {   // x = center, y = top
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y + s * 0.3);
      ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
      ctx.bezierCurveTo(x - s * 0.5, y + s * 0.65, x, y + s * 0.8, x, y + s);
      ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.65, x + s * 0.5, y + s * 0.3);
      ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
      ctx.fill();
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // plain: true  -> solid color, no photo borders / date pill
    const STYLES = {
      black: { name: "Classic", plain: true, bg: "#17181c", text: "#ffffff",
        draw(ctx, W, H) { ctx.fillStyle = this.bg; ctx.fillRect(0, 0, W, H); } },

      cream: { name: "Cream", plain: true, bg: "#fbf3e4", text: "#17181c",
        draw(ctx, W, H) { ctx.fillStyle = this.bg; ctx.fillRect(0, 0, W, H); } },

      hearts: { name: "Hearts",
        draw(ctx, W, H) {
          ctx.fillStyle = "#fdeedd"; ctx.fillRect(0, 0, W, H);
          for (let r = 0; r * 100 < H + 100; r++)
            for (let c = -1; c * 110 < W + 110; c++)
              heart(ctx, c * 110 + (r % 2 ? 55 : 0), r * 100, 46, "#b8362e");
        } },

      gingham: { name: "Gingham",
        draw(ctx, W, H) {
          ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = "rgba(122,160,90,0.5)";
          for (let y = 0; y < H; y += 120) ctx.fillRect(0, y, W, 60);
          for (let x = 0; x < W; x += 120) ctx.fillRect(x, 0, 60, H);
        } },

      dots: { name: "Dots",
        draw(ctx, W, H) {
          ctx.fillStyle = "#fdf4d6"; ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = "#f0a0b0";
          for (let r = 0; r * 44 < H + 44; r++)
            for (let c = 0; c * 44 < W + 44; c++) {
              ctx.beginPath();
              ctx.arc(c * 44 + (r % 2 ? 22 : 0), r * 44, 5, 0, Math.PI * 2);
              ctx.fill();
            }
        } },

      checker: { name: "Checker",
        draw(ctx, W, H) {
          ctx.fillStyle = "#fff8e6"; ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = "#a9bfe8";
          for (let r = 0; r * 80 < H; r++)
            for (let c = 0; c * 80 < W; c++)
              if ((r + c) % 2 === 0) ctx.fillRect(c * 80, r * 80, 80, 80);
        } },

      stripes: { name: "Stripes",
        draw(ctx, W, H) {
          ctx.fillStyle = "#e6eefa"; ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = "#a9c4e8";
          for (let x = 0; x < W; x += 28) ctx.fillRect(x, 0, 14, H);
        } },
    };

    function renderChips() {
      const box = $("chips");
      box.innerHTML = "";
      for (const [id, st] of Object.entries(STYLES)) {
        const chip = document.createElement("div");
        chip.className = "chip" + (id === styleId ? " active" : "");
        chip.dataset.id = id;
        const cv = document.createElement("canvas");
        cv.width = 300; cv.height = 450;
        const cx = cv.getContext("2d");
        cx.scale(0.375, 0.375);          // so the pattern looks like it does on the real strip
        st.draw(cx, 800, 1200);
        const label = document.createElement("div");
        label.textContent = st.name;
        chip.append(cv, label);
        chip.onclick = () => setStyle(id, true);
        box.appendChild(chip);
      }
    }

    function setStyle(id, fromMe) {
      if (!STYLES[id]) return;
      styleId = id;
      document.querySelectorAll("#chips .chip").forEach(c => c.classList.toggle("active", c.dataset.id === id));
      if (fromMe && conn && conn.open) conn.send({ type: "style", id });
      if ($("results").style.display === "block") showResults();
    }

    // ---------- compose the result ----------
    function loadImg(src) {
      return new Promise((res) => {
        if (!src) return res(null);
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = () => res(null);
        im.src = src;
      });
    }

    // draw an image into a box, center-cropped to fill it (like CSS object-fit: cover)
    function drawCover(ctx, img, x, y, w, h, mirror) {
      if (!img) { ctx.fillStyle = "#333"; ctx.fillRect(x, y, w, h); return; }
      const scale = Math.max(w / img.width, h / img.height);
      const sw = w / scale, sh = h / scale;
      const sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      if (mirror) {
        ctx.translate(x + w, y);
        ctx.scale(-1, 1);
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      } else {
        ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
      }
      ctx.restore();
    }

    async function showResults() {
      const mirror = $("mirror").checked;
      const n = shots();
      const leftSrc  = isHost ? mine : theirs;   // room creator always on the left
      const rightSrc = isHost ? theirs : mine;
      const L = await Promise.all(Array.from({ length: n }, (_, i) => loadImg(leftSrc[i])));
      const R = await Promise.all(Array.from({ length: n }, (_, i) => loadImg(rightSrc[i])));

      // read these AFTER the awaits so quick clicks always render the latest choice
      const l = LAYOUTS[layoutId];
      const st = STYLES[styleId];
      const { W, H } = layoutSize(l);

      const canvas = $("strip");
      canvas.width = W; canvas.height = H;
      const ratio = W / H;
      canvas.style.maxWidth = ratio > 1.1 ? "560px" : ratio > 0.8 ? "420px" : "320px";
      const ctx = canvas.getContext("2d");

      st.draw(ctx, W, H);

      const dividerColor = st.plain ? st.bg : "#ffffff";
      const half = l.cellW / 2;
      for (let i = 0; i < n; i++) {
        const { x, y } = cellXY(l, i);
        if (!st.plain) {                          // white border around each photo on patterns
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x - 10, y - 10, l.cellW + 20, l.cellH + 20);
        }
        drawCover(ctx, L[i], x, y, half, l.cellH, mirror);
        drawCover(ctx, R[i], x + half, y, half, l.cellH, mirror);
        ctx.fillStyle = dividerColor;
        ctx.fillRect(x + half - 2, y, 4, l.cellH);
      }

      const date = new Date().toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      ctx.font = `600 ${l.font}px system-ui, sans-serif`;
      ctx.textAlign = "center";
      const baseY = H - l.footer / 2 + l.font / 3;
      if (st.plain) {
        ctx.fillStyle = st.text;
        ctx.fillText(date, W / 2, baseY);
      } else {
        const tw = ctx.measureText(date).width;
        const ph = l.font + 22;
        ctx.fillStyle = "#ffffff";
        roundRectPath(ctx, W / 2 - tw / 2 - 30, baseY - l.font + 2 - 11, tw + 60, ph, ph / 2);
        ctx.fill();
        ctx.fillStyle = "#17181c";
        ctx.fillText(date, W / 2, baseY);
      }

      $("results").style.display = "block";
    }

    $("mirror").onchange = showResults;

    $("downloadBtn").onclick = () => {
      $("strip").toBlob((blob) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `booth-${layoutId}-${styleId}.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }, "image/png");
    };

    $("shootBtn").onclick = () => runSequence(true);
    $("retakeBtn").onclick = () => runSequence(true);

    renderLayoutChips();
    renderChips();

    // ---------- room setup ----------
    $("createBtn").onclick = async () => {
      if (!(await getCamera())) return;
      isHost = true;
      const code = makeCode();
      peer = new Peer(PREFIX + code);
      peer.on("open", () => showCall(code));
      peer.on("call", (call) => { call.answer(localStream); attachCall(call); });
      peer.on("connection", setupConn);
      peer.on("error", (e) => {
        setStatus(e.type === "unavailable-id" ? "Code clash, press Start again." : "Error: " + e.type);
      });
    };

    $("joinBtn").onclick = async () => {
      const code = $("joinCode").value.trim().toUpperCase();
      if (code.length !== 5) return setStatus("Enter the 5-letter code.");
      if (!(await getCamera())) return;
      peer = new Peer();
      peer.on("open", () => {
        showCall(code);
        attachCall(peer.call(PREFIX + code, localStream));
        setupConn(peer.connect(PREFIX + code, { reliable: true }));
      });
      peer.on("error", (e) => {
        setStatus(e.type === "peer-unavailable" ? "Room not found." : "Error: " + e.type);
      });
    };

    $("muteBtn").onclick = () => {
      const t = localStream.getAudioTracks()[0];
      t.enabled = !t.enabled;
      $("muteBtn").textContent = t.enabled ? "Mute" : "Unmute";
    };
    $("camBtn").onclick = () => {
      const t = localStream.getVideoTracks()[0];
      t.enabled = !t.enabled;
      $("camBtn").textContent = t.enabled ? "Camera off" : "Camera on";
    };
    $("leaveBtn").onclick = () => {
      if (currentCall) currentCall.close();
      if (peer) peer.destroy();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      location.reload();
    };
  </script>
</body>
</html>
